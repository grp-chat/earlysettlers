<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Settlers | Main Menu</title>
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --panel-navy: #16213e;
            --gold: #f1c40f;
            --accent: #e94560; 
            --card-blue: #0f3460;
            --text-white: #e2e2e2;
        }

        /* 1. THE BACKGROUND LAYER */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Lowest layer */
            background-color: hsla(200, 70%, 70%, 1);
            background-image:        
                url('https://78.media.tumblr.com/cae86e76225a25b17332dfc9cf8b1121/tumblr_p7n8kqHMuD1uy4lhuo1_540.png'), 
                url('https://78.media.tumblr.com/66445d34fe560351d474af69ef3f2fb0/tumblr_p7n908E1Jb1uy4lhuo1_1280.png'),
                url('https://78.media.tumblr.com/8cd0a12b7d9d5ba2c7d26f42c25de99f/tumblr_p7n8kqHMuD1uy4lhuo2_1280.png'),
                url('https://78.media.tumblr.com/5ecb41b654f4e8878f59445b948ede50/tumblr_p7n8on19cV1uy4lhuo1_1280.png'),
                url('https://78.media.tumblr.com/28bd9a2522fbf8981d680317ccbf4282/tumblr_p7n8kqHMuD1uy4lhuo3_1280.png');
            background-repeat: repeat-x;
            background-position: 0 20%, 0 100%, 0 50%, 0 100%, 0 0;
            background-size: 2500px, 800px, 500px 200px, 1000px, 400px 260px;
            animation: 50s para infinite linear;
        }

        @keyframes para {
            100% {
                background-position: -5000px 20%, -800px 100%, 500px 50%, 1000px 100%, 400px 0;
            }
        }

        /* 2. THE CONTENT LAYER */
        body.main-menu-body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-white);
            overflow: hidden;
            /* background-color: white;  */
        }

        #menu-container {
            position: relative;
            z-index: 10; /* Higher than the background */
            text-align: center;
            padding: 3.5rem 2rem;
            background: var(--panel-navy);
            border: 3px solid var(--gold);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 480px;
            width: 90%;
        }

        /* --- UI ELEMENTS --- */
        .game-title {
            font-size: 3.5rem;
            color: var(--gold);
            margin: 0;
            line-height: 0.9;
            text-shadow: 2px 2px 0px #000;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
        }

        .branding-top { font-size: 0.85rem; color: #888; letter-spacing: 4px; margin-top: 15px; text-transform: uppercase; }
        .tagline { color: var(--accent); font-size: 0.75rem; letter-spacing: 3px; font-weight: bold; text-transform: uppercase; }

        .menu-button-group { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }

        .menu-btn {
            background: var(--card-blue);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .menu-btn:hover {
            background: var(--gold);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body class="main-menu-body">
    
    <div class="parallax-bg"></div>

    <div id="menu-container">
        <header class="menu-header">
            <h1 class="game-title">EARLY SETTLERS</h1>
            <p class="branding-top">BY COACH ANDREW</p>
            <p class="tagline">A RISING KINGDOMS SAGA</p>
        </header>
        
        <div class="menu-button-group">
            <button class="menu-btn" onclick="window.location.href='/settings.html'">⚙️ GAME SETTINGS</button>
            <button class="menu-btn" onclick="window.location.href='/dashboard.html'">📺 DASHBOARD</button>
            <button class="menu-btn" onclick="window.location.href='/controller.html'">⛏️ ACTION PANEL</button>
            <button class="menu-btn" onclick="window.location.href='/adjustments.html'">🛠️ RESOURCE ADJUSTMENTS</button>
        </div>
    </div>

</body>
</html>
