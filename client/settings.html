<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Settlers | Kingdom Settings</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .resource-config-item {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            align-items: center;
        }

        .resource-select {
            flex-grow: 1;
            background: #0a0a1a;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
        }

        .remove-btn {
            background: #900;
            color: white;
            border: none;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <header class="resource-bar">
            <div class="resource-item">⚙️ KINGDOM ADMINISTRATION</div>
            <div class="resource-item" id="connection-status" style="color: var(--accent-color);">OFFLINE</div>
        </header>

        <main class="content-area">
            <aside class="sidebar">
                <section class="panel">
                    <h3 style="color: var(--gold); border-bottom: 1px solid #444; padding-bottom: 10px;">Round Resources
                    </h3>
                    <div id="resource-pool-container" style="margin-top: 10px; max-height: 300px; overflow-y: auto;">

                    </div>
                    <button class="menu-btn" style="width: 100%; margin-top: 10px; font-size: 0.7rem;"
                        onclick="addResourceRow()">+ Add Resource Button</button>
                    
                </section>

                <section class="panel">
                    <h3>Navigation</h3>
                    <div class="menu-button-group">
                        <button class="menu-btn" onclick="window.location.href='/'">🏰 Main Menu</button>
                        <button class="menu-btn"
                        style="background: #600; border-color: #a00; color: #ffcccc; font-size: 0.75rem;"
                        onclick="triggerSoftReset()">
                        ♻️ SOFT RESET GAME
                    </button>
                    </div>
                </section>
            </aside>

            <section class="build-menu">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Settler Roster</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button class="menu-btn"
                            style="background: #228b22; border-color: #32cd32; box-shadow: 0 0 10px rgba(50,205,50,0.3); margin: 0;"
                            onclick="saveAllToCloud()">
                            🏰 COMMIT TO KINGDOM
                        </button>
                        <span id="player-count"
                            style="color: var(--gold); font-weight: bold; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--gold); white-space: nowrap;">
                            0 Settlers
                        </span>
                    </div>
                </div>

                <div class="panel"
                    style="margin-bottom: 20px; flex-direction: column; display: flex; gap: 10px; background: rgba(0,0,0,0.4); border: 1px dashed var(--gold);">
                    <label style="color: var(--gold); font-size: 0.8rem; letter-spacing: 1px; font-weight: bold;">PASTE
                        SETTLER NAMES (ONE PER LINE)</label>
                    <textarea id="bulk-player-names" placeholder="Adam&#10;Sarah&#10;John..."
                        style="width: 100%; height: 80px; padding: 12px; background: #0a0a1a; border: 1px solid #444; color: white; border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
                    <button class="menu-btn" style="width: 100%; margin: 0;" onclick="addBulkPlayers()">+ MASS
                        RECRUITMENT</button>
                </div>

                <div id="current-school-display" style="display: none;"></div>

                <div class="panel"
                    style="min-height: 450px; background: rgba(0,0,0,0.3); overflow-y: auto; padding: 0;">
                    <table id="roster-table" style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr
                                style="color: var(--gold); border-bottom: 2px solid var(--gold); font-size: 0.8rem; letter-spacing: 1px;">
                                <th style="padding: 15px;">SETTLER NAME</th>
                                <th>KINGDOM TEAM</th>
                                <th>SQUAD/GROUP</th>
                                <th style="text-align: right; padding-right: 20px;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="roster-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Helper to add new rows for resource selection
        function addResourceRow() {
            const container = document.getElementById('resource-pool-container');
            const div = document.createElement('div');
            div.className = 'resource-config-item';
            div.innerHTML = `
                <select class="resource-select">
                    <option value="wood">Wood</option>
                    <option value="clay">Clay</option>
                    <option value="stone">Stone</option>
                    <option value="random">Random (?)</option>
                </select>
                <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(div);
        }
    </script>
    <script src="js/settings.js"></script>
</body>

</html>
